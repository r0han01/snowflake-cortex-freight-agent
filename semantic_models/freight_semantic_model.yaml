# =============================================================================
# Freight Intelligence — Cortex Analyst Semantic Model
# File   : freight_semantic_model.yaml
# Phase  : 4 of 9  (the high-leverage phase — 80% of agent accuracy lives here)
# Author : Rishi Kumar Kota
# Target : HIGHLINE_FREIGHT.DATA.V_FREIGHT_FLOWS_ENRICHED  (7,791,945 rows)
#
# What this file does
# -----------------------------------------------------------------------------
# Tells Cortex Analyst how to translate natural-language questions about U.S.
# freight flows into correct SQL against our enriched view.  Defines:
#   * 8  dimensions      (geography, commodity, mode, trade type, distance)
#   * 1  time dimension  (year, 2018-2024)
#   * 6  measures        (tons, value, current_value, ton-miles, row count,
#                         derived value_per_ton)
#   * 2  named filters   (Highline-specific category shortcuts)
#   * 7  verified queries (canonical question→SQL templates)
#
# How to upload
# -----------------------------------------------------------------------------
# Snowsight → Catalog → HIGHLINE_FREIGHT → MODELS → YAML_STAGE → "+ Files"
# Or via SnowSQL:   PUT file://freight_semantic_model.yaml
#                       @HIGHLINE_FREIGHT.MODELS.YAML_STAGE
#                       AUTO_COMPRESS=FALSE OVERWRITE=TRUE;
# =============================================================================

name: freight_intelligence
description: |
  Cortex Analyst semantic model for U.S. DOT Freight Analysis Framework v5.7.1
  state-level freight flows from 2018 to 2024 (7.8M rows). Tuned for Highline
  Warren's auto-aftermarket distribution context. Use plain English to ask
  about volumes, values, modes, lanes, commodities, and year-over-year trends.

tables:

  - name: FREIGHT_FLOWS
    description: |
      Every row represents the total amount of a specific commodity that moved
      between a specific origin and destination, by a specific transport mode,
      in a specific year. Pre-joined to lookups so commodity codes, state
      codes, and mode codes appear as human-readable names.
    base_table:
      database: HIGHLINE_FREIGHT
      schema:   DATA
      table:    V_FREIGHT_FLOWS_ENRICHED

    # -------------------------------------------------------------------------
    # DIMENSIONS  — categorical fields the agent can filter / group by
    # -------------------------------------------------------------------------
    dimensions:

      - name: ORIGIN_STATE_NAME
        expr: origin_state_name
        data_type: VARCHAR
        description: |
          The U.S. state where the freight movement begins. For imports, this
          is the U.S. state where the import first enters the country. NULL
          for foreign-to-foreign records.
        sample_values:
          - California
          - Texas
          - Illinois
          - New York
          - Ohio
        synonyms:
          - origin
          - from
          - source
          - shipped from
          - ship-from state
          - departure state
          - starting state
          - originating state
          - where it came from
          - source state

      - name: DESTINATION_STATE_NAME
        expr: destination_state_name
        data_type: VARCHAR
        description: |
          The U.S. state where the freight movement ends. For exports, this is
          the U.S. state from which the export leaves the country.
        sample_values:
          - California
          - Texas
          - Florida
          - New York
          - Georgia
        synonyms:
          - destination
          - to
          - target
          - shipped to
          - ship-to state
          - arrival state
          - ending state
          - receiving state
          - where it went
          - destination state

      - name: FOREIGN_ORIGIN_NAME
        expr: foreign_origin_name
        data_type: VARCHAR
        description: |
          For imports, the foreign region where the goods originated.
          NULL for purely domestic shipments.
        sample_values:
          - Canada
          - Mexico
          - Eastern Asia
          - Europe
          - SE Asia & Oceania
        synonyms:
          - imported from
          - source country
          - foreign source
          - country of origin
          - import origin
          - exporting region
          - foreign supplier region

      - name: FOREIGN_DESTINATION_NAME
        expr: foreign_destination_name
        data_type: VARCHAR
        description: |
          For exports, the foreign region where the goods are headed.
          NULL for purely domestic shipments.
        sample_values:
          - Canada
          - Mexico
          - Eastern Asia
          - Europe
          - Rest of Americas
        synonyms:
          - exported to
          - destination country
          - foreign buyer
          - export destination
          - importing region
          - foreign customer region

      - name: COMMODITY_NAME
        expr: commodity_name
        data_type: VARCHAR
        description: |
          The category of goods being shipped, per the SCTG (Standard
          Classification of Transported Goods) 2-digit taxonomy. 42 categories
          ranging from raw materials (Live animals, Coal, Crude petroleum) to
          finished goods (Pharmaceuticals, Motorized vehicles, Electronics).
        sample_values:
          - Gasoline
          - Motorized vehicles
          - Pharmaceuticals
          - Plastics/rubber
          - Base metals
          - Waste/scrap
          - Electronics
        synonyms:
          - product
          - goods
          - item
          - category
          - freight type
          - what's being shipped
          - cargo
          - merchandise
          - commodity
          - product type
          - SCTG

      - name: DOMESTIC_MODE_NAME
        expr: domestic_mode_name
        data_type: VARCHAR
        description: |
          The mode of transportation used within the United States.
          Air includes truck-air combinations. Multimodal covers shipments
          combining multiple modes or mail.
        sample_values:
          - Truck
          - Rail
          - Water
          - Air (include truck-air)
          - Multiple modes & mail
          - Pipeline
        synonyms:
          - mode
          - transport mode
          - transportation method
          - how it's shipped
          - shipping method
          - way of shipping
          - mode of transport
          - shipping channel
          - transportation
          - shipping type

      - name: TRADE_TYPE_NAME
        expr: trade_type_name
        data_type: VARCHAR
        description: |
          Whether the freight movement is purely within the United States
          (Domestic), into the country (Import), or out of the country (Export).
        sample_values:
          - Domestic
          - Import
          - Export
        synonyms:
          - flow type
          - trade flow
          - freight type
          - type of shipment
          - domestic or import or export
          - international vs domestic

      - name: DISTANCE_BAND_LABEL
        expr: distance_band_label
        data_type: VARCHAR
        description: |
          Distance bucket for the freight movement, in miles. 8 buckets:
          Below 100, 100-249, 250-499, 500-749, 750-999, 1000-1499,
          1500-2000, Over 2,000. Used to analyze short-haul vs long-haul mix.
        sample_values:
          - Below 100
          - 100 - 249
          - 500 - 749
          - 1,000 - 1,499
          - Over 2,000
        synonyms:
          - distance
          - range
          - miles
          - mileage
          - distance range
          - how far
          - distance bucket
          - haul length
          - short-haul or long-haul

    # -------------------------------------------------------------------------
    # TIME DIMENSIONS
    # -------------------------------------------------------------------------
    time_dimensions:

      - name: YEAR
        expr: year
        data_type: NUMBER
        description: |
          The calendar year of the freight movement. Available values are
          2018 through 2024. Use this for year-over-year comparisons,
          trend analysis, and any time-bounded queries.
        sample_values:
          - '2018'
          - '2019'
          - '2020'
          - '2023'
          - '2024'
        synonyms:
          - when
          - time
          - period
          - annual
          - fiscal year
          - calendar year

    # -------------------------------------------------------------------------
    # MEASURES  — numeric quantities to aggregate
    # -------------------------------------------------------------------------
    measures:

      - name: TONS
        expr: tons
        data_type: FLOAT
        description: |
          Weight of the commodities shipped, in thousand tons. Use SUM for
          totals, AVG for averages. This is the primary volume metric.
        sample_values:
          - '65.6'
          - '3100.5'
        synonyms:
          - weight
          - tonnage
          - volume
          - mass
          - freight weight
          - thousand tons
          - kilotons
          - tons shipped

      - name: VALUE
        expr: value
        data_type: FLOAT
        description: |
          Total dollar value of the commodities shipped, in millions of
          2017-CONSTANT US dollars (inflation-adjusted). USE THIS measure
          for year-over-year value comparisons — it removes inflation effects.
        sample_values:
          - '126.13'
          - '4324.33'
        synonyms:
          - value
          - dollar value
          - worth
          - $
          - real value
          - constant dollars
          - inflation-adjusted value
          - 2017 dollars

      - name: CURRENT_VALUE
        expr: current_value
        data_type: FLOAT
        description: |
          Total dollar value in millions of CURRENT-YEAR US dollars (nominal,
          NOT inflation-adjusted). Use this when the user asks for "actual"
          or "nominal" dollar amounts for a specific year.
        sample_values:
          - '122.4'
          - '212.4'
        synonyms:
          - nominal value
          - current dollars
          - actual dollars
          - that year's dollars
          - face value
          - nominal worth

      - name: TON_MILES
        expr: tmiles
        data_type: FLOAT
        description: |
          Total freight effort in million ton-miles (weight × distance).
          Captures how much physical work was done to move the freight —
          a key logistics-intensity metric.
        sample_values:
          - '3.58'
          - '394.65'
        synonyms:
          - ton-miles
          - tmiles
          - freight effort
          - logistics intensity
          - weight-distance product
          - hauling effort

      - name: RECORD_COUNT
        expr: '1'
        data_type: NUMBER
        description: |
          Count of distinct freight-flow records (each row in the source view
          is one origin/dest/commodity/mode/year combination). Use SUM to get
          total records or COUNT for filtered counts.
        sample_values:
          - '1'
        synonyms:
          - row count
          - record count
          - number of flows
          - count of records
          - flow count

      - name: VALUE_PER_TON
        expr: 'SUM(value) / NULLIF(SUM(tons), 0)'
        data_type: FLOAT
        description: |
          Average dollar value per ton (millions of USD per thousand tons).
          Proxy for "commodity density" — high values mean light, expensive
          goods (electronics, pharma); low values mean heavy, cheap goods
          (gravel, coal, gasoline).
        sample_values:
          - '1.92'
          - '0.50'
        synonyms:
          - $ per ton
          - dollar density
          - freight value density
          - value density
          - average price per ton
          - commodity density

    # -------------------------------------------------------------------------
    # NAMED FILTERS  — Highline-specific domain shortcuts
    # -------------------------------------------------------------------------
    filters:

      - name: highline_relevant_commodities
        expr: sctg2 IN ('24', '32', '33', '36', '37', '41')
        description: |
          The 6 SCTG codes most relevant to Highline Warren's auto-aftermarket
          distribution business:
            24 = Plastics/rubber       (battery cases, hoses, gaskets)
            32 = Base metals           (lead — primary battery raw material)
            33 = Articles-base metal   (finished metal parts)
            36 = Motorized vehicles    (the end-product Highline serves)
            37 = Transport equipment   (auto parts, components)
            41 = Waste/scrap           (battery recycling backhaul)
        synonyms:
          - our category
          - auto aftermarket
          - our products
          - our business
          - our SKUs
          - automotive aftermarket
          - our commodities
          - aftermarket categories
          - Highline categories

      - name: highline_lead_battery
        expr: sctg2 IN ('32', '41')
        description: |
          Lead-related commodities for the battery supply chain:
            32 = Base metals (lead input for new batteries)
            41 = Waste/scrap (used batteries flowing to recycling)
          Use this filter when analyzing battery supply chain or recycling.
        synonyms:
          - battery supply chain
          - lead and recycling
          - lead supply chain
          - battery materials
          - lead-acid battery flow
          - battery raw materials and scrap

    # -------------------------------------------------------------------------
    # NOTE: Verified queries (question → SQL templates) were removed from the
    # YAML — Snowflake's current schema rejects this field at this nesting
    # level. They can be added later through the Snowsight Semantic Model UI
    # (AI & ML → Studio → Cortex Analyst → Verified Queries tab), which is the
    # supported path. The semantic model functions fully without them; we lose
    # a small accuracy nudge on canonical question patterns, not core capability.
    # -------------------------------------------------------------------------
